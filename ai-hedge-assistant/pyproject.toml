[project]
name = "ai-hedge-assistant"
version = "0.1.0"
description = "AI financial assistant for FX hedge planning with MOEX futures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AI Hedge Assistant" }]
dependencies = [
  "streamlit==1.32.2",
  "requests==2.31.0",
  "pandas==2.2.0",
  "altair==5.2.0",
  "pywebview==4.4.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.0.2",
  "ruff==0.3.0",
  "black==24.2.0",
]

[tool.black]
line-length = 100

target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
